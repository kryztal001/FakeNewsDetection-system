
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Fake News Detection System  {% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Application CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" id="appSidebar" aria-label="Main navigation">

        <div class="logo">
            <span aria-hidden="true">📰</span>
            <span>Fake News</span>

            <button
                type="button"
                class="mobile-sidebar-close"
                id="closeSidebar"
                aria-label="Close navigation menu">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <nav>

            <a href="{{ url_for('dashboard') }}">
                🏠 Dashboard
            </a>

            <a href="{{ url_for('detect') }}">
                📝 Detect News
            </a>

            <a href="{{ url_for('upload') }}">
                📂 Upload File
            </a>

            <a href="{{ url_for('upload_image') }}">
                🖼 Upload Image
            </a>
<!-- 
            <a href="{{ url_for('history') }}">
                📜 History
            </a> -->

            <a href="{{ url_for('about') }}">
                ℹ️ About
            </a>

             <div class="text" style="color: whitesmoke;",>
            <span><b>Model Information!</b></span><br><br>
            <span><strong>Algorithm:Logistic Regression</strong></span><br><br>
            <span><strong>Text representation:TF-IDF</strong></span>
              


<!--             
             <a href="{{ url_for('settings') }}" class="text-decoration-none">
    <i class="bi bi-gear-fill me-1"></i>
    Settings
</a> -->

            <!-- <a href="{{ url_for('logout') }}">
                🚪 Logout
            </a> -->

        </nav>

    </aside>

    <!-- Mobile menu backdrop -->
    <div
        class="sidebar-backdrop"
        id="sidebarBackdrop"
        aria-hidden="true">
    </div>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">

            <button
                type="button"
                class="mobile-menu-toggle"
                id="openSidebar"
                aria-label="Open navigation menu"
                aria-controls="appSidebar"
                aria-expanded="false">
                <i class="bi bi-list"></i>
            </button>

            <h2>Fake News Detection System </h2>

            <div class="user">
                👤 {{ session["user"] }}
            </div>

        </header>

        <section class="page-content">

            {% block content %}
            {% endblock %}

        </section>

    </main>

</div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Mobile navigation -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const sidebar = document.getElementById("appSidebar");
    const openButton = document.getElementById("openSidebar");
    const closeButton = document.getElementById("closeSidebar");
    const backdrop = document.getElementById("sidebarBackdrop");

    function openMenu() {
        sidebar.classList.add("sidebar-open");
        backdrop.classList.add("backdrop-visible");
        document.body.classList.add("mobile-menu-open");
        openButton.setAttribute("aria-expanded", "true");
    }

    function closeMenu() {
        sidebar.classList.remove("sidebar-open");
        backdrop.classList.remove("backdrop-visible");
        document.body.classList.remove("mobile-menu-open");
        openButton.setAttribute("aria-expanded", "false");
    }

    openButton.addEventListener("click", openMenu);
    closeButton.addEventListener("click", closeMenu);
    backdrop.addEventListener("click", closeMenu);

    sidebar.querySelectorAll("nav a").forEach(function (link) {
        link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeMenu();
        }
    });
});
</script>

</body>
</html>

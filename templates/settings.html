{% extends "base.html" %}

{% block title %}
Fake News Detection System
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h3>⚙ Account Settings</h3>

        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-success">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Username

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        value="{{ user.username }}">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        New Password

                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="Leave blank to keep current password">

                </div>

                <button class="btn btn-primary">

                    Save Changes

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
